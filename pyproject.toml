[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlpanel"
version = "0.1.0"
description = "Yerel, canlı RL eğitim paneli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.0"]
tb = ["tensorboard>=2.12"]
dev = ["pytest>=8", "httpx>=0.27", "stable-baselines3>=2.0", "gymnasium>=0.29", "tensorboard>=2.12", "playwright>=1.44"]

[project.scripts]
rlpanel = "rlpanel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlpanel = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny SB3 model", "e2e: drives a real browser via Playwright"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
